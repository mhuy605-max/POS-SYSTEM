name: dakao_in_bill
description: Offline Android order and Bluetooth bill application for Đakao.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  drift: 2.35.0
  drift_flutter: 0.3.1
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  file_picker: 13.1.0
  path_provider: 2.1.6
  archive: 4.3.0
  crypto: 3.0.7
  image: 4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.0
  build_runner: 2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/dakao_logo.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 800
